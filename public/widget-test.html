<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chatbot Widget Test</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #eef2f7;
        color: #172033;
        font-family: system-ui, sans-serif;
      }
      main {
        max-width: 620px;
        padding: 32px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Example client website</h1>
      <p>The booking widget is loaded from one standalone script in the lower-right corner.</p>
    </main>
    <script>
      var params = new URLSearchParams(window.location.search);
      var widget = document.createElement('script');
      widget.src = '/widget/chatbot-widget.js';
      widget.dataset.clientId = params.get('client_id') || '00000000-0000-4000-8000-000000000001';
      document.body.appendChild(widget);
    </script>
  </body>
</html>
